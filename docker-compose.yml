services:
  redis:
    image: redis:7.4.5-alpine
    container_name: ai-interview-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.9.0
    container_name: ai-interview-livekit
    command: --config /etc/livekit.yaml --dev
    ports:
      - "17880:7880"
      - "17881:7881"
      - "17882:7882/udp"
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  backend-api:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend-api.Dockerfile
    container_name: ai-interview-api
    ports:
      - "18080:8080"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
      LIVEKIT_HOST: livekit
      LIVEKIT_PORT: 7880
      LIVEKIT_URL: ws://localhost:17880
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  backend-realtime:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend-realtime.Dockerfile
    container_name: ai-interview-realtime
    ports:
      - "18081:8081"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LIVEKIT_HOST: livekit
      LIVEKIT_PORT: 7880
      LIVEKIT_URL: ws://localhost:17880
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../deploy/docker/ai-service.Dockerfile
    container_name: ai-interview-ai
    ports:
      - "18000:5000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/frontend.Dockerfile
    container_name: ai-interview-frontend
    ports:
      - "13000:80"
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  redis_data:
  uploads_data:
