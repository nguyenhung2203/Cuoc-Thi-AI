version: '3.8'

services:
  # ===== DATABASE =====
  postgres:
    image: postgres:15-alpine
    container_name: ai-interview-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_interview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== CACHE =====
  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ===== LIVEKIT =====
  livekit:
    image: livekit/livekit-server:latest
    container_name: ai-interview-livekit
    command: --config /etc/livekit.yaml --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit.yaml

  # ===== MINIO (S3) =====
  minio:
    image: minio/minio:latest
    container_name: ai-interview-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ===== BACKEND API =====
  backend-api:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend-api.Dockerfile
    container_name: ai-interview-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ===== BACKEND REALTIME =====
  backend-realtime:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend-realtime.Dockerfile
    container_name: ai-interview-realtime
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ===== AI SERVICE =====
  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../deploy/docker/ai-service.Dockerfile
    container_name: ai-interview-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  # ===== FRONTEND =====
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/frontend.Dockerfile
    container_name: ai-interview-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

volumes:
  postgres_data:
  redis_data:
  minio_data:
