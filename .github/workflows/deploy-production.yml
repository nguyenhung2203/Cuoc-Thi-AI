name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -eu

            APP_DIR="/home/deploy/CuocThiAI"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Application directory does not exist. Cloning repo..."
              mkdir -p /home/deploy
              git clone git@github.com:${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            git remote set-url origin git@github.com:${{ github.repository }}.git
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            if [ ! -f .env.production ]; then
              echo ".env.production is missing"
              exit 1
            fi

            docker compose --env-file .env.production \
              -f docker-compose.prod.yml config

            docker compose --env-file .env.production \
              -f docker-compose.prod.yml rm -f -s migrate || true

            docker compose --env-file .env.production \
              -f docker-compose.prod.yml up -d --build --remove-orphans

            docker compose --env-file .env.production \
              -f docker-compose.prod.yml ps

            health_ok=false
            for attempt in 1 2 3; do
              if curl -fsS https://vieclamai.top/health; then
                health_ok=true
                break
              fi
              echo "Health check attempt $attempt/3 failed; retrying in 10 seconds..."
              sleep 10
            done

            if [ "$health_ok" != true ]; then
              echo "Health check failed after 3 attempts"
              exit 1
            fi

            docker image prune -f
