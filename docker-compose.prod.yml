services:
  redis:
    image: redis:7.4.5-alpine
    command: sh -c 'redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/migration.Dockerfile
    env_file: [.env.production]
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  backend-api:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend-api.prod.Dockerfile
    env_file: [.env.production]
    environment:
      APP_ENV: production
      REDIS_HOST: redis
      AI_SERVICE_URL: http://ai-service:8000
      LIVEKIT_HOST: livekit
      LIVEKIT_PORT: 7880
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [internal, edge]
    restart: unless-stopped

  backend-realtime:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend-realtime.prod.Dockerfile
    env_file: [.env.production]
    environment:
      APP_ENV: production
      REDIS_HOST: redis
      LIVEKIT_HOST: livekit
      LIVEKIT_PORT: 7880
      REALTIME_PORT: 8081
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [internal, edge]
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../deploy/docker/ai-service.prod.Dockerfile
    env_file: [.env.production]
    environment:
      REDIS_HOST: redis
    depends_on:
      redis: {condition: service_healthy}
    networks: [internal, edge]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.9.0
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    command: sh -c 'sed "s/__LIVEKIT_API_KEY__/${LIVEKIT_API_KEY}/; s/__LIVEKIT_API_SECRET__/${LIVEKIT_API_SECRET}/" /etc/livekit.template.yaml > /tmp/livekit.yaml && exec livekit-server --config /tmp/livekit.yaml'
    volumes:
      - ./deploy/livekit/livekit.prod.yaml.template:/etc/livekit.template.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    depends_on:
      redis: {condition: service_healthy}
    networks: [internal, edge]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/frontend.prod.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: ""
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL}
    networks: [edge]
    restart: unless-stopped

  caddy:
    image: caddy:2.10.0-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      APP_DOMAIN: ${APP_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: {condition: service_started}
      backend-api: {condition: service_started}
      backend-realtime: {condition: service_started}
    networks: [edge]
    restart: unless-stopped

volumes:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  edge:
