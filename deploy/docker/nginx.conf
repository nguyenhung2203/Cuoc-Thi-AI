events { worker_connections 1024; }
http {
    # Slightly above the app's MAX_UPLOAD_MB (10) so the app owns the JSON 413
    # instead of nginx returning an HTML error page the SPA can't parse.
    client_max_body_size 12m;

    server {
        listen 80;
        location / {
            proxy_pass http://frontend:3000;
        }
        location /api/ {
            proxy_pass http://backend-api:8080;
        }
        location /uploads/ {
            proxy_pass http://backend-api:8080;
        }
        location /ws/ {
            proxy_pass http://backend-realtime:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}
